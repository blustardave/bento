name: Build Bento (Windows + Mac)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      releaseId: ${{ steps.release.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the update-signing key is set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret: repo Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      # Every build gets a higher version number, so installed copies
      # know there's something newer to update to.
      - name: Set version to 0.1.${{ github.run_number }}
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = '0.1.${{ github.run_number }}';
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          "

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      # The Rust side's tests (which files the page may read and write).
      - name: Rust tests
        shell: bash
        run: npm run build && cargo test --manifest-path src-tauri/Cargo.toml

      # The release starts as a draft: users only see it (and the updater only
      # offers it) once the Mac job has added its files and published it.
      - uses: tauri-apps/tauri-action@v0
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: build-${{ github.run_number }}
          releaseName: "Bento 0.1.${{ github.run_number }}"
          releaseBody: |
            **New here?**
            - **Windows:** download **Bento_0.1.${{ github.run_number }}_x64-setup.exe** below and run it.
            - **Mac:** download **Bento_0.1.${{ github.run_number }}_universal.dmg**, open it and drag Bento into Applications. The first time, macOS will say it can't check the app (it isn't notarised by Apple yet): open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. You only need to do this once.

            **Already have Bento?** You don't need to download anything — it updates itself. Look for "Update ready" in the title bar.

            Built from commit ${{ github.sha }}.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set version to 0.1.${{ github.run_number }}
        run: |
          node -e "
            const fs = require('fs');
            const f = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = '0.1.${{ github.run_number }}';
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          "

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # One app for both Apple Silicon and Intel Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      # Adds the Mac files (and the Mac entries in latest.json) to the
      # draft release the Windows job just made…
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.build.outputs.releaseId }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      # …then publishes it, so both platforms go live together. If anything
      # above failed, the release stays a draft and no one is offered it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.build.outputs.releaseId }}" -F draft=false
