[package]
name = "bento"
version = "0.1.0"
description = "A minimal, fast CSV editor"
authors = ["blustardave"]
repository = "https://github.com/blustardave/bento"
homepage = "https://github.com/blustardave/bento"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = "debuginfo"
