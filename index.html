<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento</title>
    <script>
      // Apply the theme before anything paints, so there's no flash.
      try {
        var t = localStorage.getItem("bento.theme") || "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <button id="menu-btn" class="logo-btn" title="Menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" fill="var(--accent)" />
            <rect x="5.2" y="5.2" width="6.2" height="13.6" rx="1.6" fill="var(--on-accent)" />
            <rect x="12.6" y="5.2" width="6.2" height="6.2" rx="1.6" fill="var(--on-accent)" />
            <rect x="12.6" y="12.6" width="6.2" height="6.2" rx="1.6" fill="var(--on-accent)" opacity=".55" />
          </svg>
        </button>
        <div id="tabs"></div>
        <button id="new-tab" class="icon-btn" title="New sheet (Ctrl+N)">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
        </button>
        <div class="drag-fill" data-tauri-drag-region></div>
        <div class="actions">
          <button id="find-btn" class="icon-btn" title="Find (Ctrl+F)">
            <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.2 10.2 13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <button id="theme-btn" class="icon-btn" title="Theme"></button>
        </div>
        <div class="winctl">
          <button id="win-min" title="Minimise"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M1 5h8" stroke="currentColor" stroke-width="1"/></svg></button>
          <button id="win-max" title="Maximise"><svg viewBox="0 0 10 10" width="10" height="10"><rect x="1.5" y="1.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1" fill="none"/></svg></button>
          <button id="win-close" title="Close"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.1"/></svg></button>
        </div>
      </header>
      <div id="progress"><div></div></div>

      <div id="cellbar">
        <div id="cell-name">A1</div>
        <div class="fx">fx</div>
        <input id="cell-input" spellcheck="false" autocomplete="off" />
      </div>

      <main id="main">
        <div id="grid-wrap">
          <canvas id="grid-canvas"></canvas>
          <div id="scroller"><div id="spacer"></div></div>
          <textarea id="editor" spellcheck="false" autocomplete="off" wrap="off"></textarea>
          <textarea id="keysink" aria-label="Spreadsheet" spellcheck="false" autocomplete="off"></textarea>
        </div>
        <div id="empty" hidden></div>
        <div id="loading" hidden></div>
      </main>

      <footer id="status">
        <div id="status-left"></div>
        <div id="status-right"></div>
      </footer>
    </div>
    <div id="drop-hint" hidden><div>Drop to open</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
