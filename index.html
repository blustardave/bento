<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento</title>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <button id="menu-btn" class="logo-btn" title="Menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" fill="#d97757" />
            <rect x="5.2" y="5.2" width="6.2" height="13.6" rx="1.6" fill="#fbf9f4" />
            <rect x="12.6" y="5.2" width="6.2" height="6.2" rx="1.6" fill="#fbf9f4" />
            <rect x="12.6" y="12.6" width="6.2" height="6.2" rx="1.6" fill="#fbf9f4" opacity=".55" />
          </svg>
        </button>
        <div id="tabs"></div>
        <button id="new-tab" class="icon-btn" title="New sheet (Ctrl+N)">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3.5v9M3.5 8h9"/></svg>
        </button>
        <div class="drag-fill" data-tauri-drag-region></div>
        <button id="check-btn" class="icon-btn check-btn" title="Check for updates"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M13 8a5 5 0 1 1-1.46-3.54"/><path d="M13 2.75v3h-3"/></svg></button>
        <button id="update-btn" class="update-pill" hidden title="A new version of Bento is ready">Update ready · Restart</button>
        <div id="theme-toggle" class="segmented" role="radiogroup" aria-label="Theme">
          <button data-theme-opt="system" title="Match Windows" role="radio"><svg viewBox="0 0 16 16" width="14" height="14"><rect x="2" y="3" width="12" height="8.5" rx="1.5"/><path d="M6 14h4M8 11.5V14"/></svg></button>
          <button data-theme-opt="light" title="Light" role="radio"><svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.75v1.5M8 12.75v1.5M1.75 8h1.5M12.75 8h1.5M3.6 3.6l1.05 1.05M11.35 11.35l1.05 1.05M3.6 12.4l1.05-1.05M11.35 4.65l1.05-1.05"/></svg></button>
          <button data-theme-opt="dark" title="Dark" role="radio"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M13.25 9.6A5.5 5.5 0 0 1 6.4 2.75a5.5 5.5 0 1 0 6.85 6.85Z"/></svg></button>
        </div>
        <div class="winctl">
          <button id="win-min" title="Minimise"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 8h9"/></svg></button>
          <button id="win-max" title="Maximise"><svg viewBox="0 0 16 16" width="14" height="14"><rect x="3.5" y="3.5" width="9" height="9" rx="1.75"/></svg></button>
          <button id="win-close" title="Close"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M4.25 4.25l7.5 7.5M11.75 4.25l-7.5 7.5"/></svg></button>
        </div>
      </header>
      <div id="progress"><div></div></div>
      <div id="toolbar" role="toolbar" aria-label="Sheet tools"></div>
      <!-- Lives outside the toolbar so it stays put while the toolbar folds away. -->
      <button id="toolbar-toggle" class="icon-btn" title="Hide the toolbar (Ctrl+Shift+F)"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M4.5 9.75 8 6.25l3.5 3.5"/></svg></button>

      <div id="cellbar">
        <div id="cell-name-box"><input id="cell-name" value="A1" spellcheck="false" autocomplete="off" title="Go to (Ctrl+G): type a cell like B12, a range like A1:C9, a column (C), a row (12) or Sheet2!A1" /></div>
        <div class="fx">fx</div>
        <input id="cell-input" spellcheck="false" autocomplete="off" />
      </div>

      <main id="main">
        <div id="grid-wrap">
          <canvas id="grid-canvas"></canvas>
          <div id="scroller"><div id="spacer"></div></div>
          <textarea id="editor" spellcheck="false" autocomplete="off" wrap="off"></textarea>
          <textarea id="keysink" aria-label="Spreadsheet" spellcheck="false" autocomplete="off"></textarea>
        </div>
        <div id="empty" hidden></div>
        <div id="loading" hidden></div>
      </main>

      <footer id="status">
        <div id="status-left"></div>
        <div id="status-right"><span id="status-stats"></span><span id="status-dims"></span></div>
      </footer>
    </div>
    <div id="drop-hint" hidden><div>Drop to open</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
